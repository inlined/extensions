  - name: COLLECTION_PATH
    type: string
    label: Collection path
    default: posts

  - name: WILDCARD_IDS
    type: boolean
    label: Enable Wildcard Column field with Parent Firestore Document IDs
    input:
      select:
        options:
          - label: No
            value: false
          - label: Yes
            value: true
    default: false

  - name: DATASET_ID
    type: string
    label: Dataset ID
    default: firestore_export

  - name: TABLE_ID
    type: string
    label: Table ID
    default: posts

  - name: TABLE_PARTITIONING
    type: string
    label: BigQuery SQL table Time Partitioning option type
    input:
      select:
        options:
          - label: hour
            value: HOUR
          - label: day
            value: DAY
          - label: month
            value: MONTH
          - label: year
            value: YEAR
          - label: none
            value: NONE
    default: NONE

  - name: TIME_PARTITIONING_FIELD
    type: string
    label: BigQuery Time Partitioning column name

  - name: TIME_PARTITIONING_FIRESTORE_FIELD
    type: string
    label: Firestore Document field name for BigQuery SQL Time Partitioning field option

  - name: TIME_PARTITIONING_FIELD_TYPE
    type: string
    label: BigQuery SQL Time Partitioning table schema field(column) type
    input:
      select:
        options:
          - label: TIMESTAMP
            value: TIMESTAMP
          - label: DATETIME
            value: DATETIME
          - label: DATE
            value: DATE
          - label: omit
            value: omit
    default: omit

  - name: CLUSTERING
    type: string
    label: BigQuery SQL table clustering

  - name: MAX_DISPATCHES_PER_SECOND
    type: int
    label: Maximum number of synced documents per second
    default: 100

  - name: VIEW_TYPE
    type: string
    label: View Type
    input:
      select:
        options:
          - label: View
            value: view
          - label: Materialized View (Incremental)
            value: materialized_incremental
          - label: Materialized View (Non-incremental)
            value: materialized_non_incremental
    default: view

  - name: MAX_STALENESS
    type: string
    label: Maximum Staleness Duration

  - name: REFRESH_INTERVAL_MINUTES
    type: int
    label: Refresh Interval (Minutes)

  - name: BACKUP_COLLECTION
    type: string
    label: Backup Collection Name

  - name: TRANSFORM_FUNCTION
    type: string
    label: Transform function URL

  - name: USE_NEW_SNAPSHOT_QUERY_SYNTAX
    type: string
    label: Use new query syntax for snapshots
    input:
      select:
        options:
          - label: Yes
            value: yes
          - label: No
            value: no
    default: no

  - name: EXCLUDE_OLD_DATA
    type: string
    label: Exclude old data payloads
    input:
      select:
        options:
          - label: Yes
            value: yes
          - label: No
            value: no
    default: no

  - name: KMS_KEY_NAME
    type: string
    label: Cloud KMS key name

  - name: MAX_ENQUEUE_ATTEMPTS
    type: int
    label: Maximum number of enqueue attempts
    default: 3

  - name: LOG_LEVEL
    type: string
    label: Log level
    input:
      select:
        options:
          - label: Debug
            value: debug
          - label: Info
            value: info
          - label: Warn
            value: warn
          - label: Error
            value: error
          - label: Silent
            value: silent
    default: info

endpoints:
  fsexportbigquery:
    platform: gcfv2
    entryPoint: fsexportbigquery
    eventTrigger:
      eventType: google.cloud.firestore.document.v1.written
      region: "{{ params.DATABASE_REGION }}"
      eventFilters:
        database: "{{ params.DATABASE }}"
        document: "{{ params.COLLECTION_PATH }}/{documentId}"
  
  syncBigQuery:
    platform: gcfv1
    entryPoint: syncBigQuery
    taskQueueTrigger:
      rateLimits:
        maxConcurrentDispatches: 500
        maxDispatchesPerSecond: "{{ params.MAX_DISPATCHES_PER_SECOND }}"
      retryConfig:
        maxAttempts: 5
        minBackoffSeconds: 60

  initBigQuerySync:
    platform: gcfv1
    entryPoint: initBigQuerySync
    taskQueueTrigger:
      retryConfig:
        maxAttempts: 15
        minBackoffSeconds: 60

  setupBigQuerySync:
    platform: gcfv1
    entryPoint: setupBigQuerySync
    taskQueueTrigger:
      retryConfig:
        maxAttempts: 15
        minBackoffSeconds: 60
